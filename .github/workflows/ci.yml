name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Enable unprivileged low ports for strict virtual-endpoint tests
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - name: Format check
        run: make fmt-check
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m
      - name: govulncheck
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...

  integration:
    name: Docker API integration
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Enable unprivileged low ports for strict virtual-endpoint tests
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - name: Core integration suite
        run: make integration doctor matrix-harness-test
      - name: Docker Compose topology suite
        env:
          COMPOSE_BIN: docker compose
        run: make compose-topology

  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Linux amd64 and arm64
        run: make checksums
      - uses: actions/upload-artifact@v4
        with:
          name: docker-zero-${{ github.sha }}
          path: |
            dist/docker-zero-linux-amd64
            dist/docker-zero-linux-arm64
            dist/SHA256SUMS
          if-no-files-found: error
