name: docker-zero-demo

# This exercises simulated HTTP/RESP endpoints, not real application containers.
services:
  web:
    image: nginx:alpine
    restart: "no"
    ports:
      - "127.0.0.1:${DOCKER_ZERO_HTTP_PORT:-18080}:80"

  cache:
    image: redis:7-alpine
    restart: "no"
    ports:
      - "127.0.0.1:${DOCKER_ZERO_REDIS_PORT:-16379}:6379"
